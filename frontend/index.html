<!DOCTYPE html>
<html>
<head>
  <title>ResQNet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

  <!-- Header -->
  <header>
    <div class="logo-area">
      <div class="logo-icon">R</div>
      <h1>ResQNet</h1>
    </div>

    <div class="user-setup">
      <input id="username" placeholder="Enter your name">
    </div>
  </header>

  <!-- Chat -->
  <div class="chat-container">
    <ul id="messages"></ul>

    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">💬</div>
      <p>No messages yet</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">

    <div class="input-container">
      <input id="messageInput" placeholder="Enter your name first..." disabled>
    </div>

    <button id="sendBtn" class="primary" onclick="sendMessage()" disabled>
      Send
    </button>

    <button id="emergencyBtn" class="danger" onclick="sendEmergency()" disabled>
      🚨 Emergency Alert
    </button>

    <button id="safeBtn" class="primary" onclick="setSafe()" disabled>
      🟢 I'm Safe
    </button>

    <button id="helpBtn" class="danger" onclick="needHelp()" disabled>
      🆘 Need Help
    </button>

    <button id="locationBtn" class="primary" onclick="shareLocation()" disabled>
      📍 Share Location
    </button>

    <button id="relayBtn" onclick="toggleRelay()">
      🔁 Relay Mode OFF
    </button>

  </div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
